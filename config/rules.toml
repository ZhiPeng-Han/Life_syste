# LifeOS 默认规则（程序记忆）
# 这份文件就是"不再需要思考的决策"。每次周复盘后，根据系统建议修改这里，并 git commit。
# 修改历史 = 你的生活方式迭代史。

[general]
currency = "£"            # 货币符号，按实际修改
day_start = "07:00"
day_end = "22:00"   # 之后是复位、签到、放松，不再排任务
buffer_ratio = 0.2         # 每天留 20% 缓冲，不排满
checkin_time = "22:10"

# ---------------------------------------------------------------
# 领域：每周时间预算（小时）与本季度角色
# role: main = 主线(权重1.5) / side = 支线(1.0) / frozen = 冻结(0.3)
# ---------------------------------------------------------------
[domains."关系"]
budget = 12
role = "main"
keywords = ["她", "女友", "女朋友", "约会", "纪念日", "惊喜", "一起"]

[domains."建筑工作"]
budget = 45
role = "main"
keywords = ["项目", "设计", "甲方", "图纸", "方案", "立面", "平面", "会议", "事务所", "施工"]

[domains."Part3"]
budget = 7
role = "main"
keywords = ["part3", "part 3", "pedr", "riba", "arb", "case study", "合同", "jct", "执业", "考试", "复习"]

[domains."器材事业"]
budget = 7
role = "side"
keywords = ["镜头", "相机", "收了", "出了", "上架", "发货", "快递", "闲鱼", "ebay", "mpb", "买家", "卖家", "捡漏", "成色", "机身", "转售", "平台"]

[domains."自媒体"]
budget = 4
role = "side"
keywords = ["视频", "自媒体", "剪辑", "选题", "脚本", "小红书", "b站", "youtube", "抖音", "粉丝"]

[domains."生活维持"]
budget = 8
role = "side"
keywords = ["家务", "打扫", "卫生", "洗衣", "做饭", "做菜", "买菜", "超市", "收纳", "垃圾"]

[domains."健康"]
budget = 4
role = "side"
keywords = ["锻炼", "健身", "跑步", "睡眠", "体重", "减肥", "徒步", "拉伸", "游泳"]

[domains."旅行"]
budget = 0
role = "side"
keywords = ["旅行", "旅游", "冰岛", "机票", "酒店", "行程", "签证", "极光"]

[domains."阅读思考"]
budget = 3
role = "side"
keywords = ["书", "阅读", "哲学", "思考", "导则", "人生"]

