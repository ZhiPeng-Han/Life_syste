# ---------------------------------------------------------------
# 天时
# ---------------------------------------------------------------
[yi]
enabled = true
weight = 0.5   # 卦象"姿态"对建议的影响程度：0 = 只看不影响，1 = 影响最大（仍然只是轻重，不改变事实）

[environment]
city = "伦敦"      # 按你实际所在城市修改（用于天气）
latitude = 51.51
longitude = -0.13

# 看看外面：新闻源（RSS）。domain 是默认归属的领域。可增删。
[[environment.feeds]]
url = "https://www.dezeen.com/architecture/feed/"
domain = "建筑工作"

[[environment.feeds]]
url = "https://petapixel.com/feed/"
domain = "器材事业"

[[environment.feeds]]
url = "https://feeds.bbci.co.uk/news/business/rss.xml"
domain = "建筑工作"

[[environment.feeds]]
url = "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
domain = "自媒体"

# 天下大事（不归属某个领域，每日梳理时由 Claude 判断和你有没有关系）
[[environment.feeds]]
url = "https://feeds.bbci.co.uk/news/world/rss.xml"

[[environment.feeds]]
url = "https://feeds.bbci.co.uk/news/uk/rss.xml"

# ---------------------------------------------------------------
# 记忆中枢：系统一开始就认识的"事物"。之后你提到的地点、器材型号、她的愿望里的事会自动加入。
# ---------------------------------------------------------------
[memory]
topics = ["冰岛", "极光", "减肥", "转售平台"]

# ---------------------------------------------------------------
# 照片回响：填你的照片文件夹（可以是 Immich 的存储目录），然后运行 python -m lifeos photos scan
# ---------------------------------------------------------------
[photos]
folders = []   # 例如 ["~/Pictures/Photos Library Export", "~/Pictures/Lightroom"]

# ---------------------------------------------------------------
# Telegram 机器人定时推送（需要 python -m lifeos bot 在运行）。留空就不推送。
# ---------------------------------------------------------------
[telegram]
morning = ""          # 例如 "07:45"：推送早安
weekly_digest = ""    # 例如 "Sun 20:00"：推送本周大势与一封信的开头
