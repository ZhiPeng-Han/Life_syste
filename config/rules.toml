# ---------------------------------------------------------------
# 决策自主等级（L0 记录 / L1 建议 / L2 默认 / L3 自动+汇报 / L4 托管）
# cap = 上限，系统永远不会把该类决策升级到超过这个等级
# ---------------------------------------------------------------
[autonomy.daily_plan]
level = 2
cap = 3
desc = "每日日程"

[autonomy.meal_plan]
level = 2
cap = 4
desc = "每周菜单与购物清单"

[autonomy.deal_eval]
level = 1
cap = 2
desc = "捡漏收购评估"

[autonomy.listing_price]
level = 1
cap = 3
desc = "上架定价"

[autonomy.surprise]
level = 1
cap = 1
desc = "惊喜建议（永远只建议）"

[autonomy.life]
level = 0
cap = 1
desc = "人生重大决策（只做镜子）"

[autonomy_policy]
min_samples = 20       # 至少多少次反馈才考虑升级
promote_rate = 0.9     # 采纳率达到多少提议升级

# ---------------------------------------------------------------
# 器材事业
# ---------------------------------------------------------------
[business]
min_profit_abs = 40          # 期望利润绝对值下限
min_profit_ratio = 0.15      # 期望利润 / 收购价 下限
hour_value = 15              # 你的时间单价（用于扣除时间成本）
default_hours_per_item = 1.5 # 每件平均处理小时（检测+拍照+上架+沟通+发货）
stale_days = 21              # 上架多少天算滞销
max_inventory_value = 3000   # 库存占用资金上限

# 平台费率：初始值仅为占位，请按各平台当前真实费率修改
[business.platform_fee]
"闲鱼" = 0.01
"eBay" = 0.13
"MPB" = 0.0
"小红书" = 0.05
"其他" = 0.05

# 瑕疵折价：初始值是猜测，系统会用你的真实成交数据自动校准（见 lifeos/business.py）
[business.defect_discount]
"雾" = 0.10
"霉" = 0.25
"划痕" = 0.05
"脱胶" = 0.20
"对焦异常" = 0.30
"卡口磨损" = 0.03
"灰" = 0.02

# ---------------------------------------------------------------
# 共同基金：器材利润的一部分自动计入
# ---------------------------------------------------------------
[funds."冰岛基金"]
target = 4000          # 初始估计，两人 7–10 天，按实际行程修改
share_of_profit = 0.3  # 器材事业净利润的 30% 计入

# ---------------------------------------------------------------
# 菜单
# ---------------------------------------------------------------
[meals]
light_dinners_per_week = 4   # 支持她减肥：每周至少几顿轻食晚餐

# ---------------------------------------------------------------
