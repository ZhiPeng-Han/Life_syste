# LifeOS 默认规则（程序记忆）
# 这份文件就是"不再需要思考的决策"。每次周复盘后，根据系统建议修改这里，并 git commit。
# 修改历史 = 你的生活方式迭代史。

[ai]
# auto：设置了 ANTHROPIC_API_KEY 就实时调用 API；没有就只靠每日梳理（默认）
# daily：不实时调用任何 AI，只靠每天的 Claude Code 定时任务梳理（不需要 API key）
# claude-code：在你主动点的地方（写信、问卦解读、惊喜方案）调用本机的 claude 命令，用你的 Claude 登录；会慢一些
mode = "auto"

[general]
currency = "£"            # 货币符号，按实际修改
day_start = "07:00"
day_end = "22:00"   # 之后是复位、签到、放松，不再排任务
buffer_ratio = 0.2         # 每天留 20% 缓冲，不排满
checkin_time = "22:10"

# ---------------------------------------------------------------
# 领域：每周时间预算（小时）与本季度角色
# role: main = 主线(权重1.5) / side = 支线(1.0) / frozen = 冻结(0.3)
# ---------------------------------------------------------------
